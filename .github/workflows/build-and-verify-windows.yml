name: Build and verify the Windows installer

# LIVES IN THE PUBLIC INSTALLERS REPO ON PURPOSE.
#
# The source repo (none298-dotcom/revealthedream) is PRIVATE, so its Actions minutes are metered
# and the account is billing blocked: a workflow committed there does not run at all, it is
# refused before the runner starts. Public repositories get free Actions minutes, so the build
# lives here and checks the private source out with a read-only token. Source never lands in this
# repo, only the finished installer does. Same arrangement as MyLinedChart-installers.
#
# Do NOT "tidy" this back into the source repo. It will silently stop running.
#
# ONE-TIME SETUP, in this repo's Settings > Secrets and variables > Actions:
#   Secret PRIVATE_REPO_TOKEN: a fine-grained PAT with Contents: Read-only on
#   none298-dotcom/revealthedream.
#
# The verification steps exist because a sibling project failed Microsoft certification with
# "the product crashes at launch" while its own smoke test was green, because that test ran the
# app from the SOURCE folder and the shipped installer was missing a file. Every assertion below
# is made against the INSTALLED artifact.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Private repo branch, tag or SHA to build"
        default: "main"
        required: true
      publish:
        description: "Attach the installer to the 'latest' release here"
        type: boolean
        default: false
      # ON by default as of 2026-08-06, run 31078467934, which is the first time this whole path
      # went green on a Windows runner: resolution change, four store screenshots, and the click
      # test that presses "I Did It" and asserts a check-in was actually recorded (completed days
      # 11 -> 12, 2328 sample points changed). The note this replaces said to turn it on
      # deliberately, watch it pass, then flip the default. That has now happened.
      #
      # It stays a switch rather than becoming unconditional because a failure here stops the
      # publish steps, which is the correct default but not always what you want: turn it off to
      # ship an installer when the screenshot path itself is what is broken.
      screenshots:
        description: "Shoot Microsoft Store screenshots and run the click test"
        type: boolean
        default: true
      # VERIFY WHAT MICROSOFT WILL ACTUALLY DOWNLOAD, rather than a sibling build of the same
      # source. Added 2026-08-06: the binary behind the submission's package URL turned out not to
      # be the one any gate had ever run against. Two builds of identical source differ in bytes
      # anyway, because signing timestamps and MSI GUIDs are not reproducible, so "same version"
      # and "same source" do not add up to "verified". This project's own rule is to test the
      # PACKAGE, and the package is whatever is at that URL.
      #
      # Given a URL, the build step is skipped entirely and every gate below runs against the
      # downloaded bytes instead.
      package_url:
        description: "Verify THIS exact installer URL instead of building one (leave blank to build)"
        type: string
        default: ""

permissions:
  contents: write     # create/update the Release on this public repo
  id-token: write     # OIDC token for Azure Trusted Signing, so no cert is stored here

jobs:
  build-and-verify:
    # `secrets` is not a valid context in a step-level `if:` (GitHub rejects the whole workflow
    # with "Unrecognized named-value: 'secrets'"). Surfacing them as job env vars is the supported
    # way for a step to ask "is signing configured here?", which keeps the build working in a
    # fork with no Azure access.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    # PINNED, not windows-latest. windows-latest moved to Server 2025, where a byte identical
    # installer passed 1 run in 6 against 3 of 3 on Server 2022 on the sibling project. Only move
    # this deliberately, and compare over at least six runs.
    runs-on: windows-2022

    steps:
      - name: Check out the PRIVATE source
        uses: actions/checkout@v4
        with:
          repository: none298-dotcom/revealthedream
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Widgets Board provider. COMPILING IT IS THE ONLY THING THIS RUNNER CAN PROVE.
      #
      # Windows Server has no Widgets Board, on 2022 or 2025, so no runner can ever answer whether
      # the widget appears. That question needs a human on Windows 11. What this step does catch is
      # the whole class of failure that got the provider written in the first place: an earlier
      # draft called two helper methods that do not exist anywhere. A compiler finds that; reading
      # it again does not.
      #
      # It also validates the package manifest, because a malformed AppxManifest fails registration
      # on a customer's machine with an error that reads like a corrupt download.
      # MSBUILD, NOT `dotnet build`. Windows App SDK's MRT targets call
      # Microsoft.Build.Packaging.Pri.Tasks.ExpandPriContent, which ships with Visual Studio's Appx
      # tooling and is NOT in the dotnet SDK at any version. `dotnet build` fails with "the task
      # could not be loaded", which reads like a broken package reference. It was first mistaken
      # here for an SDK version problem and pinned to .NET 8; the identical error then appeared on
      # 8.0.423, which is what ruled the version out.
      - name: .NET 8 for the widget provider
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile the widget provider
        shell: pwsh
        working-directory: windows/WidgetProvider
        run: |
          dotnet restore RevealWidgetProvider.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { Write-Error "Restore failed"; exit 1 }

          # PUBLISH, not build. Trimming only runs on publish, and a plain build would quietly
          # produce the untrimmed 40 MB of runtime while the project file claimed otherwise.
          msbuild RevealWidgetProvider.csproj /t:Publish /p:Configuration=Release /p:Platform=x64 /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { Write-Error "Widget provider does not build"; exit 1 }

          $out = "bin/x64/Release/net8.0-windows10.0.22621.0/win-x64/publish"
          if (-not (Test-Path "$out/RevealWidgetProvider.exe")) {
            Write-Error "No provider executable at $out"; exit 1
          }
          $size = [math]::Round(((Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum).Sum)/1MB, 1)
          $count = (Get-ChildItem $out -Recurse -File).Count
          Write-Host "Provider output: $count files, $size MB"

          # Guard the whole point of trimming. Untrimmed this was 213 files and about 40 MB, so a
          # silent regression back to that would double the download again with nothing reporting
          # it. Generous ceiling: this is a tripwire, not a budget.
          if ($size -gt 25) { Write-Error "Provider is ${size} MB. Trimming is not taking effect."; exit 1 }

      - name: Check the package manifest
        shell: pwsh
        working-directory: windows/Package
        run: |
          # Well-formedness first, so a broken file fails here rather than inside makeappx.
          [xml]$m = Get-Content AppxManifest.xml
          Write-Host "Identity:  $($m.Package.Identity.Name) $($m.Package.Identity.Version)"
          Write-Host "Publisher: $($m.Package.Identity.Publisher)"

          # The publisher must match the signing certificate subject character for character, or
          # registration fails with a generic error that looks like a corrupt package.
          $expected = 'CN=Little Bird Trading LLC, O=Little Bird Trading LLC, L=Newark, S=Delaware, C=US'
          if ($m.Package.Identity.Publisher -ne $expected) {
            Write-Error "Publisher does not match the signing identity.`n  manifest: $($m.Package.Identity.Publisher)`n  expected: $expected"
            exit 1
          }

          # Every asset the manifest names must exist. A missing one is accepted by the packager
          # and shows up as a blank tile in the widget picker.
          $missing = @()
          Select-String -Path AppxManifest.xml -Pattern 'Assets\\[A-Za-z0-9]+\.png' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Value } | Sort-Object -Unique |
            ForEach-Object { if (-not (Test-Path $_)) { $missing += $_ } }
          if ($missing.Count) { Write-Error "Missing package assets: $($missing -join ', ')"; exit 1 }
          Write-Host "All referenced assets present"

      # LOGS IN ONCE, BEFORE THE FIRST SIGNING STEP. Two things get signed now, the widget package
      # and the installer, and this used to sit between them: the widget signing failed with a
      # credential error while the installer signed fine, which reads like a problem with the
      # package rather than with the ordering.
      #
      # trusted-signing-action authenticates via DefaultAzureCredential, which knows nothing about
      # GitHub OIDC on its own. Without azure/login first it falls through every credential in the
      # chain (CLI, Developer CLI, Visual Studio) and dies with "SignerSign() failed". azure/login
      # performs the federated exchange and leaves the runner in a state the action can use.
      #
      # Nothing secret lives in this public repo: the three AZURE_* values are identifiers, and
      # the certificates are short lived, minted by Azure per run.
      - name: Azure login (federated, OIDC)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # PACK THE SPARSE PACKAGE. Only the manifest and the icons go inside; the provider
      # executable stays outside and is found via -ExternalLocation at registration time. That is
      # what keeps the 55 MB jpackage bundle out of MSIX entirely.
      - name: Pack the widget MSIX
        id: msix
        shell: pwsh
        run: |
          $layout = "$env:RUNNER_TEMP\msix-layout"
          New-Item -ItemType Directory -Force -Path $layout | Out-Null
          Copy-Item windows/Package/AppxManifest.xml $layout
          Copy-Item windows/Package/Assets $layout -Recurse

          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
          if (-not $makeappx) { Write-Error "makeappx.exe not found in the Windows SDK"; exit 1 }

          $out = "$env:RUNNER_TEMP\RevealTheDreamWidgets.msix"
          & $makeappx.FullName pack /d $layout /p $out /nv /o
          if ($LASTEXITCODE -ne 0) { Write-Error "makeappx failed"; exit 1 }
          "msix=$out" >> $env:GITHUB_OUTPUT
          Write-Host "Packed $([math]::Round((Get-Item $out).Length/1KB,1)) KB"

      # An UNSIGNED sparse package cannot be registered at all: Add-AppxPackage refuses it unless
      # the machine is in developer mode. Signing it with the same Trusted Signing identity as the
      # installer is what makes registration work on an ordinary customer machine.
      - name: Sign the widget MSIX
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          files: ${{ steps.msix.outputs.msix }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Staged BEFORE the installer is built. appResourcesRootDir copies resources/windows/ into the
      # installed application directory, so the package ships inside the installer and the app can
      # register it on first launch without a separate download.
      - name: Stage the MSIX and the provider into the app resources
        shell: pwsh
        run: |
          $res = "android/desktop/resources/windows"
          New-Item -ItemType Directory -Force -Path $res | Out-Null
          Copy-Item "${{ steps.msix.outputs.msix }}" "$res/RevealTheDreamWidgets.msix"
          # The provider executable and its self-contained runtime live NEXT TO the app, which is
          # exactly what the package's external location points at.
          Copy-Item "windows/WidgetProvider/bin/x64/Release/net8.0-windows10.0.22621.0/win-x64/publish/*" $res -Recurse -Force
          Write-Host "Staged $((Get-ChildItem $res -Recurse -File).Count) files"

      # No Android SDK is installed here and none is needed: :desktop is plain Kotlin/JVM.
      # Verified 2026-08-02 on a checkout with local.properties removed and ANDROID_HOME cleared.
      # If this starts failing with "SDK location not found", something has made :desktop depend
      # on an Android module, and that is the real bug.
      #
      # RUNS AFTER the staging above, deliberately. jpackage copies the resources directory as it
      # finds it, so building first would ship an installer with no widget package and nothing
      # would report the omission.
      - name: Build the installer
        if: ${{ inputs.package_url == '' }}
        working-directory: android
        # packageMsi as well as packageExe. Adding TargetFormat.Msi to build.gradle.kts does NOT
        # make packageExe produce one: each format is its own Gradle task. The first run of the
        # scope measurement below found zero .msi files, printed "Nothing to measure" and exited 0,
        # which is the same shape of false pass this whole investigation has been about.
        run: ./gradlew :desktop:packageExe :desktop:packageMsi --console=plain --no-daemon

      # The submitted artifact, fetched and pinned by hash so the log records exactly which bytes
      # every assertion below is about.
      - name: Download the installer under test
        id: fetch
        if: ${{ inputs.package_url != '' }}
        shell: pwsh
        run: |
          $url = "${{ inputs.package_url }}"
          $out = Join-Path $env:RUNNER_TEMP "package-under-test.exe"
          Write-Host "Fetching $url"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          $item = Get-Item $out
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash
          Write-Host "Bytes : $($item.Length)"
          Write-Host "SHA256: $hash"

          # A redirect or an error page saved as .exe would otherwise sail through and fail later
          # as something confusing. MZ is the DOS header every Windows executable starts with.
          $head = [System.IO.File]::ReadAllBytes($out)[0..1]
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) {
            Write-Error "That URL did not return a Windows executable. First bytes were $($head -join ',')."
            exit 1
          }
          "installer=$out" >> $env:GITHUB_OUTPUT
          "name=$($item.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "## Package under test`n`n``$url```n`nSHA256 ``$hash```n`n$($item.Length) bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Find the installer
        id: find
        if: ${{ inputs.package_url == '' }}
        shell: pwsh
        working-directory: android
        run: |
          # Scoped to the exe/ output directory ON PURPOSE. A bare recursive *.exe search also
          # matches the app image jpackage stages under app/, which contains a "Reveal the
          # Dream.exe" that is the APPLICATION, not the installer. Picking that one would install
          # nothing and still look like it worked.
          $found = @(Get-ChildItem -Recurse -Filter *.exe -Path desktop/build/compose/binaries/main/exe -ErrorAction SilentlyContinue)
          if ($found.Count -ne 1) {
            Write-Error "Expected exactly one installer, found $($found.Count)"
            $found | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          $exe = $found[0]
          "installer=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($exe.Name)  $([math]::Round($exe.Length/1MB,1)) MB"

          # THE VERSION, from three places that must agree, because the manifest's `winVersion` is
          # what every installed copy compares itself against. Get it wrong and the update check is
          # silently dead: customers are simply never told a new build exists, and nothing anywhere
          # reports a problem. That is not hypothetical, it is what this repo did until 2026-08-04,
          # when the publish step wrote winUrl and winSizeBytes and left winVersion untouched.
          #
          #   1. build.gradle.kts packageVersion  -- what jpackage was told to build
          #   2. the installer's own file name    -- what jpackage actually produced
          #   3. Main.kt APP_VERSION              -- what the running app compares with
          #
          # Three sources rather than one because each catches a different mistake: a bump that
          # missed a file, a stale build directory serving an older exe, and the app-versus-package
          # drift the comment on APP_VERSION already warns about.
          $gradleVersion = (Select-String -Path desktop/build.gradle.kts -Pattern 'packageVersion\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $appVersion = (Select-String -Path desktop/src/main/kotlin/com/revealthedream/desktop/Main.kt -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($exe.Name -notmatch '(\d+\.\d+\.\d+)') { Write-Error "Cannot read a version out of '$($exe.Name)'"; exit 1 }
          $fileVersion = $Matches[1]

          Write-Host "Version: gradle=$gradleVersion  file=$fileVersion  app=$appVersion"
          if ($gradleVersion -ne $fileVersion -or $gradleVersion -ne $appVersion) {
            Write-Error "Version disagreement. build.gradle.kts=$gradleVersion, installer=$fileVersion, Main.kt APP_VERSION=$appVersion. All three must match or the update check lies to customers."
            exit 1
          }
          "version=$gradleVersion" >> $env:GITHUB_OUTPUT

      # SIGN BEFORE INSTALLING, so everything below verifies the artifact a customer will run,
      # not an unsigned near-copy of it. Auth was established by the login step further up.
      # Signs as Little Bird Trading LLC, the identity validation behind this account. The
      # installer's own Manufacturer field is set to match in android/desktop/build.gradle.kts;
      # if the signing identity ever changes, change that too or Windows shows two companies.
      # Every step below refers to this, so the built path and the downloaded path converge here
      # rather than each later step repeating the same conditional and one of them getting it wrong.
      - name: Resolve the installer under test
        id: installed_pkg
        shell: pwsh
        run: |
          $built = "${{ steps.find.outputs.installer }}"
          $fetched = "${{ steps.fetch.outputs.installer }}"
          $exe = if ($fetched) { $fetched } else { $built }
          if (-not $exe) { Write-Error "No installer: nothing was built and nothing was downloaded."; exit 1 }
          Write-Host "Installer under test: $exe"
          "installer=$exe" >> $env:GITHUB_OUTPUT

      # NOT run when verifying a downloaded package: re-signing would rewrite the exact bytes the
      # run exists to check, and the artifact at a submission URL is already signed.
      - name: Sign the installer (Azure Trusted Signing)
        if: ${{ inputs.package_url == '' && env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          # MUST be absolute. The signing client rejects a relative path outright with
          # "The file path '...' is not rooted."
          files: ${{ steps.installed_pkg.outputs.installer }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A signing step that quietly did nothing still reports success, so assert on the file.
      # Countersigner matters as much as signer: without a timestamp the signature dies the day
      # the certificate expires, and Trusted Signing certificates are short lived by design.
      - name: Assert the signature actually landed
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "${{ steps.installed_pkg.outputs.installer }}"
          Write-Host "Status:        $($sig.Status)"
          Write-Host "Signer:        $($sig.SignerCertificate.Subject)"
          Write-Host "Timestamp:     $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "Signature is $($sig.Status), not Valid"; exit 1 }
          if (-not $sig.TimeStamperCertificate) { Write-Error "Signed but NOT timestamped"; exit 1 }
          if ($sig.SignerCertificate.Subject -notmatch 'Little Bird Trading') {
            Write-Error "Signed by an unexpected identity: $($sig.SignerCertificate.Subject)"; exit 1
          }

      # jpackage's exe is a WiX Burn bootstrapper wrapping the same MSI, so it is driven directly
      # rather than through msiexec, and its silent switch is /quiet. Getting this wrong does not
      # error: the wrong switch opens the INTERACTIVE installer on a machine with nobody at the
      # keyboard, and the job hangs until it times out.
      # THE STORE ONLY PASSES WHAT THE SUBMISSION DECLARES.
      #
      # Microsoft rejected this app on 2026-08-06 under 10.3.4 "App Is Testable": "The product
      # failed to install through the Store ... Notice it loads indefinitely and cannot complete the
      # installation."
      #
      # Every install gate here was green and none of them could have caught it, because every one
      # of them passed `/quiet` itself. That proves OUR install command works and says nothing about
      # the command the Store issues. Reproducing it took one run: started bare, the installer was
      # still sitting there two minutes later. The comment on the step below had described that
      # exact outcome for months without anyone connecting it to certification.
      #
      # A bare install hanging is NOT a bug, which is why this step does not fail on it. An
      # interactive installer is supposed to wait for a human, and making it silent by default would
      # mean someone downloading the exe from the website gets no wizard and no say in where it
      # goes. The installer was right. The submission was incomplete.
      #
      # So the assertion that matters is the one below: the switches CI proves are the switches the
      # submission declares, read from ONE file rather than written down twice. This step exists to
      # print that string where whoever fills in the form will see it, and to say plainly whether
      # the parameters are optional or mandatory for this build.
      # CAN THE MSI BE INSTALLED PER-USER? Runs FIRST, on a clean machine, and removes itself, so
      # the ordinary Exe flow below still measures a fresh box.
      #
      # Why this matters: the Exe puts files in %LOCALAPPDATA% and writes its uninstall entry to
      # HKLM, which needs administrator rights, and it ignores ALLUSERS/MSIINSTALLPERUSER when they
      # are passed to it. If msiexec honours those properties on the same underlying package, then
      # the Store submission can ship the Msi with them declared and install for a standard user,
      # which is what both rejections were actually about.
      #
      # Never fails the build. It is a measurement, and the Exe is still what the gates below judge.
      # WHAT IS ACTUALLY IN THE MSI, and can the scope be edited into it.
      #
      # Established already, by measurement: the Exe registers in HKLM while its files sit in
      # %LOCALAPPDATA%, and BOTH the Exe and the Msi ignore ALLUSERS=2 MSIINSTALLPERUSER=1 passed on
      # the command line. So the package hardcodes its scope and no submission-time parameter can
      # change it. Writing that HKLM key needs an administrator, which is the rejection.
      #
      # This step opens the MSI database through the WindowsInstaller COM API, which is the
      # authoritative reader. A hand-rolled parser was tried off-runner and produced misaligned
      # garbage rows, so nothing it claimed about ALLUSERS was worth anything. Do not repeat that.
      #
      # Then it tries the actual fix: drop ALLUSERS from the Property table, install, and see which
      # hive it lands in. Microsoft documents an unset ALLUSERS as the per-user context.
      #
      # Never fails the build. It is a measurement, and it cleans up after itself so the Exe gates
      # below still see a clean machine.
      # WHAT IS ACTUALLY IN THE MSI, and can the scope be edited into it.
      #
      # Established by measurement: the Exe registers in HKLM while its files sit in %LOCALAPPDATA%,
      # and BOTH the Exe and the Msi ignore ALLUSERS=2 MSIINSTALLPERUSER=1 on the command line,
      # msiexec exiting 0 and still landing in HKLM. So the package hardcodes its scope and no
      # submission-time parameter can change it. Writing that HKLM key needs an administrator, which
      # is the rejection.
      #
      # Read through the WindowsInstaller COM API, the authoritative reader. A hand-rolled parser was
      # tried off-runner and produced misaligned garbage rows, so its claim that ALLUSERS was absent
      # meant nothing. Do not repeat that.
      #
      # EVERY InvokeMember IS PIPED TO Out-Null ON PURPOSE. The first version of this step wrapped
      # the query in a function and returned its rows, and PowerShell handed back the COM call
      # results instead, because whatever a function leaves on the output stream IS its return
      # value. It failed with "Cannot index into a null array". That is the same trap AGENTS.md
      # already records for Set-DisplayResolution in the store-screenshot script. Inline and
      # explicitly silenced, so there is nothing on the stream to confuse.
      #
      # Never fails the build, and uninstalls itself so the Exe gates below see a clean machine.
      - name: Report the silent install contract
        id: installparams
        shell: pwsh
        run: |
          $params = (Get-Content "tools/windows-store-install-parameters.txt" -Raw).Trim()
          if (-not $params) { Write-Error "tools/windows-store-install-parameters.txt is empty."; exit 1 }
          "params=$params" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "Silent install parameters: $params"
          $p = Start-Process "${{ steps.installed_pkg.outputs.installer }}" -PassThru
          $exited = $p.WaitForExit(90000)
          if (-not $exited) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $verdict = "MANDATORY. Run bare, this installer waits for a human forever."
          } else {
            $verdict = "Optional for installing, but declare them anyway. Bare run exited $($p.ExitCode)."
          }

          $summary = @(
            "## Microsoft Partner Center: install parameters",
            "",
            "Packages -> install parameters must contain exactly:",
            "",
            '```',
            $params,
            '```',
            "",
            "Status for this build: $verdict",
            "",
            "Leaving that field blank is what caused the 2026-08-06 rejection.")
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host $verdict

      # WHY 1603, which is what the second Microsoft rejection reported.
      #
      # 1603 is ERROR_INSTALL_FAILURE, the MSI engine's generic "something went wrong". It carries no
      # information by itself, so this step's whole job is to turn it into a real error message.
      #
      # The first rejection was a hang, fixed by declaring /quiet /norestart. The second got further:
      # the installer ran silently and then failed. Meanwhile this exact binary, by SHA256, installs
      # with exit code 0 on this runner. So the binary is not broken and the difference is the
      # ENVIRONMENT, which leaves elevation as the first suspect: a GitHub runner is an administrator
      # with UAC out of the way, and a certifier's Surface Laptop is not.
      #
      # docs/windows-store-certification.md already predicted this shape: "Per-machine needs
      # elevation. A silent install that cannot elevate must FAIL rather than quietly fall back to
      # per-user." This app installs per-machine on purpose, because the sibling project was rejected
      # twice for a per-user install whose shortcut and uninstall entry a certifier could not see.
      #
      # So this reproduces the unelevated case deliberately, with the Windows Installer logging policy
      # turned on first so the failure leaves a readable log instead of a number. It does NOT fail the
      # build: it is a diagnosis, and the elevated install below is still the gate.
      - name: Diagnose 1603, by installing the way a non-admin would
        shell: pwsh
        continue-on-error: true
        run: |
          # voicewarmupx is the full verbose set. Turning it on by policy catches every MSI action on
          # the machine, which matters because the failure is inside the MSI our exe unpacks and
          # hands off, not in the exe itself.
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer" -Name "Logging" -Value "voicewarmupx"
          Get-ChildItem $env:TEMP -Filter "MSI*.LOG" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

          $installer = "${{ steps.installed_pkg.outputs.installer }}"
          $declared = (Get-Content "tools/windows-store-install-parameters.txt" -Raw).Trim()

          # /trustlevel:0x20000 is "Basic User": the same process, stripped of the administrator
          # token. It needs no password, unlike runas with a real account, so it works on a runner.
          Write-Host "Installing WITHOUT elevation..."
          $cmd = "runas /trustlevel:0x20000 `"`"$installer`" $declared`""
          cmd /c $cmd
          Write-Host "runas returned: $LASTEXITCODE"
          Start-Sleep -Seconds 45

          Write-Host ""
          Write-Host "=== Windows Installer log, the lines that actually say what failed ==="
          $log = Get-ChildItem $env:TEMP -Filter "MSI*.LOG" -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $log) {
            Write-Host "No MSI log was produced. That itself is a finding: the failure happened"
            Write-Host "BEFORE the MSI engine started, so it is in the exe wrapper, not the package."
          } else {
            Write-Host "Log: $($log.FullName)"
            # "Return value 3" is how an MSI action reports failure, and the line above it names the
            # action. Everything else in a verbose log is noise for this purpose.
            $lines = Get-Content $log.FullName
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "Return value 3|Error 1[0-9]{3}|MainEngineThread is returning|cannot access|Access is denied|elevat") {
                $from = [Math]::Max(0, $i - 3)
                $lines[$from..$i] | ForEach-Object { Write-Host "  $_" }
                Write-Host "  ---"
              }
            }
          }

      # INSTALLS WITHOUT ELEVATION, deliberately, because that is what a certifier does.
      #
      # This step used to run as the runner's administrator, which is why it passed through two
      # Microsoft rejections. The 1603 failure was reproduced here only once the administrator token
      # was stripped, and the Windows Installer log named the cause outright:
      #
      #     MSI_LUA: Installation UI level is silent, no credential elevation is possible
      #     MainEngineThread is returning 1625
      #
      # runas /trustlevel:0x20000 is "Basic User": the same process with the elevated token removed.
      # It needs no password, unlike runas with a real account, so it works unattended.
      #
      # runas returns its own exit code and not the child's, so the install is judged by its EFFECT
      # below rather than by a number here. That is the right way round anyway: an installer that
      # returns 0 and installs nothing is a failure, and this project has been fooled by exit codes
      # and BUILD SUCCESSFUL lines more than once.
      # Installs the package directly, and asserts WHERE it landed.
      #
      # Two harnesses were tried to simulate a non-admin and both measured themselves rather than
      # the installer. runas /trustlevel:0x20000 gives a RESTRICTED token, which Windows Installer
      # refuses by policy with 1625 whatever the package looks like; the giveaway was that 1625
      # survived after the package stopped requiring elevation at all. A scheduled task running as a
      # fresh Users account never started, because such an account has no batch logon right by
      # default. Both were scaffolding failures, and neither told us anything about the product.
      #
      # What removes the whole question instead of simulating it: the package is now PER-USER, so it
      # writes to the installing user's profile and to HKCU and needs no elevation from anybody. An
      # elevation failure is not something it can have. The assertion below then proves the install
      # actually landed somewhere a person can find it, which is what 10.1.2.10 and 10.2.7 are about.
      - name: Silent install with the declared parameters
        shell: pwsh
        run: |
          $declared = (Get-Content "tools/windows-store-install-parameters.txt" -Raw).Trim() -split '\s+'
          $log = "$env:RUNNER_TEMP\install.log"
          Write-Host "Installing with the DECLARED parameters: $($declared -join ' ')"
          $p = Start-Process "${{ steps.installed_pkg.outputs.installer }}" -Wait -PassThru -ArgumentList ($declared + @("/log", "`"$log`""))
          Write-Host "Installer exit code: $($p.ExitCode)"
          # 3010 is success-plus-reboot-required, which is still a successful install.
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            Write-Error "Install failed with $($p.ExitCode)"
            exit 1
          }

      # ASSERT WHAT MICROSOFT CERTIFICATION ASSERTS, for the scope this package actually uses.
      #
      # Two rejections shaped this. MyLinedChart failed 10.1.2.10 ("no accessible method of being
      # launched") and 10.2.7 ("no entry in the Add or Remove Programs list") from a per-user install
      # whose shortcut and uninstall key a certifier could not see. This app then failed 10.3.4 with
      # 1603 from a per-machine install that cannot run unelevated at all.
      #
      # The resolution is that the certifier installs UNELEVATED, as the ordinary user. Under that
      # condition per-user is not merely acceptable, it is the only scope that can install, and the
      # shortcut and uninstall entry land in the profile of the very user doing the testing. So the
      # assertion is not "per-machine" or "per-user", it is: whoever just installed this can SEE it.
      # ASK WINDOWS WHAT SCOPE IT INSTALLED IN. DO NOT INFER IT FROM A REGISTRY HIVE.
      #
      # This gate exists because every earlier gate ran as the runner's administrator, the one
      # condition a certifier never reproduces, and accepted a shortcut in the user profile OR All
      # Users, an uninstall key in HKCU OR HKLM, and a binary in %LOCALAPPDATA% OR Program Files.
      # Whatever we shipped, it agreed, through three rejections about scope.
      #
      # ITS FIRST VERSION THEN MADE THE SAME CLASS OF MISTAKE, which is why the method is spelled
      # out here. It read the uninstall entry's hive and called HKLM "per-machine", and reported a
      # shipping bug that did not exist. On one install, on an administrator runner:
      #
      #     HKCU\...\Uninstall  -> nothing
      #     HKLM\...\Uninstall  -> Reveal the Dream
      #     files                -> C:\Users\<user>\AppData\Local\Reveal the Dream
      #     AssignmentType       -> 0, which means PER-USER
      #
      # msiexec puts the ARP entry in HKLM when an ADMINISTRATOR performs a per-user install. The
      # hive is a consequence of who ran the installer, not of the package's scope.
      #
      # So the assertion is AssignmentType, which is Windows' own answer. The hive and the paths are
      # still printed, because a gate that shows only a verdict cannot be told apart from a gate
      # with a bug in it, but they are evidence and not the decision.
      - name: Assert the install scope is the one we declared
        shell: pwsh
        run: |
          $gradle = Get-Content "android/desktop/build.gradle.kts" -Raw
          if ($gradle -notmatch 'perUserInstall\s*=\s*(true|false)') {
            Write-Error "Could not read perUserInstall from build.gradle.kts. This gate must never assume a scope."
            exit 1
          }
          $intended = if ($Matches[1] -eq 'true') { "per-user" } else { "per-machine" }

          # Windows' own accounting. Every InvokeMember is piped to Out-Null where its value is not
          # wanted: in PowerShell whatever is left on the output stream becomes the return value,
          # which broke two earlier probes in this file.
          $msi = New-Object -ComObject WindowsInstaller.Installer
          $products = $msi.GetType().InvokeMember("Products","GetProperty",$null,$msi,$null)
          $code = $null
          foreach ($pc in $products) {
            $name = $msi.GetType().InvokeMember("ProductInfo","GetProperty",$null,$msi,@($pc,"ProductName"))
            if ($name -like "*Reveal*") { $code = $pc; break }
          }
          if (-not $code) {
            Write-Error "No installed product named *Reveal* is registered with Windows Installer. The install did not take."
            exit 1
          }
          $assignment = $msi.GetType().InvokeMember("ProductInfo","GetProperty",$null,$msi,@($code,"AssignmentType"))
          $location   = $msi.GetType().InvokeMember("ProductInfo","GetProperty",$null,$msi,@($code,"InstallLocation"))
          $actual = if ("$assignment" -eq "0") { "per-user" } else { "per-machine" }

          Write-Host "Declared in build.gradle.kts : $intended"
          Write-Host "Windows AssignmentType       : $assignment  ($actual)"
          Write-Host "Windows InstallLocation      : $location"
          Write-Host "ProductCode                  : $code"

          Write-Host ""
          Write-Host "--- evidence, NOT the decision: uninstall entries by hive ---"
          foreach ($hive in @("HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall",
                              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall",
                              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall")) {
            $hits = Get-ChildItem $hive -ErrorAction SilentlyContinue |
                    ForEach-Object { Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue } |
                    Where-Object { $_.DisplayName -like "*Reveal*" }
            if ($hits) { foreach ($h in $hits) { Write-Host "  $hive -> $($h.DisplayName) $($h.DisplayVersion)" } }
            else { Write-Host "  $hive -> nothing" }
          }
          Write-Host "  (an administrator performing a per-user install lands the entry in HKLM; that is expected)"

          if ($actual -ne $intended) {
            Write-Error "SCOPE MISMATCH. build.gradle.kts asks for $intended and Windows reports $actual."
            exit 1
          }

          $verdict = if ($intended -eq "per-user") {
            "Installed per-user, into the profile of whoever ran the installer. ONLY that account gets a working app: any other Windows account on this PC has no executable. If the Store installs under a different account than the one a certifier tests in, the product appears to be missing."
          } else {
            "Installed per-machine. Every account on this PC can run it, and the installer requires elevation, so a certifier who cannot elevate cannot install it at all."
          }
          Write-Host ""
          Write-Host "WHO CAN RUN IT: $verdict"
          @("## Windows install scope", "", "Declared: ``$intended``  |  Windows AssignmentType: ``$assignment`` (``$actual``)", "", $verdict) -join "`n" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # The launch surfaces. Asserted against the declared scope where that is meaningful, and
      # deliberately NOT for the uninstall entry.
      #
      # The binary and the Start Menu shortcut DO follow the scope: a per-user install puts both in
      # the installing profile, a per-machine one puts them in Program Files and All Users. Those are
      # worth pinning, because a shortcut that is missing from where the scope says it should be is
      # the 10.1.2.10 rejection.
      #
      # The uninstall entry does NOT reliably follow the scope, and demanding HKCU for a per-user
      # install would fail a correct build. msiexec writes the ARP entry to HKLM when an
      # ADMINISTRATOR performs a per-user install, which is exactly what this runner does. So the
      # requirement is that the entry EXISTS somewhere a person can find it and carries an
      # UninstallString, which is what policy 10.2.7 actually asks for.
      - name: Assert the shortcut, uninstall entry and binary match that scope
        shell: pwsh
        run: |
          $fail = $false
          $gradle = Get-Content "android/desktop/build.gradle.kts" -Raw
          $null = $gradle -match 'perUserInstall\s*=\s*(true|false)'
          $perUser = $Matches[1] -eq 'true'

          $startMenu = if ($perUser) { "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" }
                       else          { "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" }
          $lnk = @(Get-ChildItem $startMenu -Recurse -Filter "*Reveal*.lnk" -ErrorAction SilentlyContinue) | Select-Object -First 1
          if ($lnk) { Write-Host "OK   Start Menu shortcut: $($lnk.FullName)" }
          else {
            Write-Error "No Start Menu shortcut under $startMenu, where a $(if($perUser){'per-user'}else{'per-machine'}) install must put it. This is the 10.1.2.10 rejection."
            $fail = $true
          }

          # Either hive. See the comment above for why demanding one would fail a correct build.
          $arp = Get-ItemProperty "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
                                  "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
                                  "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                 Where-Object { $_.DisplayName -like "*Reveal*" } | Select-Object -First 1
          if ($arp) {
            Write-Host "OK   Add/Remove Programs entry: $($arp.DisplayName) $($arp.DisplayVersion)"
            if (-not $arp.UninstallString) {
              Write-Error "The entry has no UninstallString, so it cannot be removed. 10.2.7."
              $fail = $true
            }
          } else {
            Write-Error "No Add/Remove Programs entry in any hive. This is the 10.2.7 rejection."
            $fail = $true
          }

          $root = if ($perUser) { $env:LOCALAPPDATA } else { $env:ProgramFiles }
          $exe = @(Get-ChildItem $root -Recurse -Filter "Reveal the Dream.exe" -ErrorAction SilentlyContinue) | Select-Object -First 1
          if ($exe) { Write-Host "OK   Installed binary: $($exe.FullName)" }
          else { Write-Error "No executable under $root. The installer reported no error and installed nothing where this scope puts it."; $fail = $true }

          if ($fail) { exit 1 }

      # Finds the INSTALLED executable, in both places an install can put it.
      #
      # This step was accidentally deleted while rewriting the assertions around it, which is why the
      # launch step then tried to Start-Process an empty path. Restored, and widened: a per-user
      # install lands under %LOCALAPPDATA% and a per-machine one under Program Files, so looking in
      # only one of them makes the whole downstream chain depend on a packaging choice it should not
      # care about.
      #
      # Scoped to the app's own folder rather than a bare recursive search, because the app image
      # also contains helper executables and picking one of those would launch nothing while looking
      # like it worked.
      - name: Locate the INSTALLED executable
        id: installed
        shell: pwsh
        run: |
          $roots = @("$env:LOCALAPPDATA", "$env:ProgramFiles", "${env:ProgramFiles(x86)}") | Where-Object { $_ -and (Test-Path $_) }
          $found = @()
          foreach ($r in $roots) {
            $found += @(Get-ChildItem -Path $r -Filter "Reveal the Dream.exe" -Recurse -Depth 2 -ErrorAction SilentlyContinue)
          }
          if ($found.Count -lt 1) {
            Write-Error "The app is installed but its executable was not found under $($roots -join ', ')."
            exit 1
          }
          $exe = $found[0]
          Write-Host "Installed executable: $($exe.FullName)"
          Write-Host "Scope: $(if ($exe.FullName -like "$env:LOCALAPPDATA*") { 'per-user' } else { 'per-machine' })"
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Launch it and assert it is really up
        shell: pwsh
        run: |
          $exe = "${{ steps.installed.outputs.exe }}"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "Launched PID $($proc.Id) from $exe"

          # THE WINDOW BELONGS TO A CHILD PID. jpackage's launcher .exe re-execs, so the process
          # Start-Process hands back is not the one that owns the window: this run reported the
          # launcher as PID 7752 and the window on PID 7776. A check that only ever looks at
          # $proc.MainWindowHandle can therefore NEVER pass, no matter how long it waits.
          #
          # That is what the first version of this step did, and it failed while the screenshot
          # showed the app running perfectly. The obvious reading was "cold runner, too slow" and
          # it was wrong; the log now prints how long the window took, and it is 3s. Polling was
          # not the fix, matching on the binary path was. Both are kept: the poll so a slow start
          # is not a false failure, the path match so the assertion can succeed at all.
          $deadline = (Get-Date).AddSeconds(150)
          $hwnd = 0
          $owner = $null
          while ((Get-Date) -lt $deadline) {
            # Liveness is checked and is explicitly NOT the assertion. On the sibling project the
            # check was "is the process alive", and Electron kept the process up behind a crash
            # dialog, so three runs scored green while the app showed an error. A JVM app has the
            # same shape: an uncaught exception on the event thread does not necessarily exit.
            if ($proc.HasExited) {
              Write-Error "Exited after $([int]((Get-Date) - $proc.StartTime).TotalSeconds)s, code $($proc.ExitCode)"
              exit 1
            }

            # Check the launched process first, then any process running THIS SAME BINARY. The
            # second case covers a launcher that re-execs into a child PID; without it a healthy
            # app would read as windowless. Matching on the path and not on the window title is
            # deliberate, so a leftover window from an earlier run cannot satisfy this.
            $proc.Refresh()
            if ($proc.MainWindowHandle -ne 0) { $hwnd = $proc.MainWindowHandle; $owner = $proc; break }

            $sibling = Get-Process | Where-Object {
              $_.MainWindowHandle -ne 0 -and $_.Path -eq $exe
            } | Select-Object -First 1
            if ($sibling) { $hwnd = $sibling.MainWindowHandle; $owner = $sibling; break }

            Start-Sleep -Seconds 3
          }

          if ($hwnd -eq 0) {
            Write-Error "Alive for 150s with no window. Running, but showing nothing."
            exit 1
          }
          $waited = [int]((Get-Date) - $proc.StartTime).TotalSeconds
          Write-Host "Window appeared after ${waited}s"
          Write-Host "  PID:    $($owner.Id)$(if ($owner.Id -ne $proc.Id) { ' (child of the launcher)' })"
          Write-Host "  Path:   $($owner.Path)"
          Write-Host "  Handle: $hwnd"
          Write-Host "  Title:  $($owner.MainWindowTitle)"

          # A window that exists but is a 1x1 sliver, or an error dialog, is not the app running.
          # The DMG gate learned this the same way and asserts a minimum size for the same reason.
          # Built as a joined single-quoted string, NOT a @'...'@ here-string: PowerShell requires
          # the here-string terminator at column 0, which is illegal inside a YAML block scalar
          # and makes the whole workflow file unparseable.
          $sig = 'public struct RECT { public int L, T, R, B; } ' +
                 '[DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);'
          Add-Type -Namespace W -Name N -MemberDefinition $sig
          $r = New-Object W.N+RECT
          [void][W.N]::GetWindowRect($hwnd, [ref]$r)
          $w = $r.R - $r.L; $h = $r.B - $r.T
          Write-Host "  Size:   ${w}x${h}"
          if ($w -lt 300 -or $h -lt 300) {
            Write-Error "Window is only ${w}x${h}. Too small to be the app."
            exit 1
          }

          # The title is a second, independent signal, and it is nearly free. A JVM launch failure
          # puts up a dialog titled with the EXECUTABLE name, "Reveal the Dream.exe", where the
          # real window is titled "Reveal the Dream". On 2026-08-02 a missing java.net.http module
          # produced exactly that: alive, windowed, and a 216x159 "Failed to launch JVM" box. Only
          # the size check caught it, by a margin that could close if the dialog ever grew.
          if ($owner.MainWindowTitle -ne 'Reveal the Dream') {
            Write-Error "Window title is '$($owner.MainWindowTitle)', expected 'Reveal the Dream'. A JVM error dialog is titled with the .exe name."
            exit 1
          }

          # Give the screenshot step a settled frame to capture rather than a half-painted one.
          Start-Sleep -Seconds 5

      - name: Screenshot, so a human can look at it
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\screen.png")
          Write-Host "Captured $($b.Width)x$($b.Height)"

      # The failure text may never reach stdout or stderr. On Windows it lands here, and a gate
      # that does not read this log will tell you everything is fine.
      - name: Read the Windows Application event log
        if: always()
        shell: pwsh
        run: |
          $events = Get-WinEvent -FilterHashtable @{
            LogName='Application'; Level=1,2; StartTime=(Get-Date).AddMinutes(-10)
          } -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'Reveal|java|jpackage' }
          if ($events) {
            $events | Select-Object -First 10 | Format-List TimeCreated, ProviderName, Message
            if ($events | Where-Object { $_.Message -match 'Reveal the Dream' }) {
              Write-Error "Application event log carries an error naming this app"; exit 1
            }
          } else { Write-Host "No error-level Application events naming this app" }

      # MICROSOFT STORE SCREENSHOTS, of the INSTALLED build.
      #
      # Microsoft wants at least one screenshot at 1366x768 or larger and there is no Windows 11
      # machine on this project, so this runner is the only place they can come from. The script
      # lives in the private source repo, next to the app it photographs, and is checked out above.
      #
      # Runs AFTER every verification gate, deliberately: it kills and relaunches the app several
      # times, and doing that before the launch assertion or the event-log read would let a
      # screenshot failure masquerade as an app failure.
      #
      # A failure here stops the publish steps below. That is on purpose. The alternative is a job
      # that goes green having produced nothing usable, and a gate that cannot fail is the worst
      # kind. Turn the `screenshots` input off to publish an installer without them.
      - name: Shoot Microsoft Store screenshots
        if: ${{ inputs.screenshots }}
        shell: pwsh
        run: |
          ./tools/windows-store-screenshots.ps1 `
            -InstalledExe "${{ steps.installed.outputs.exe }}" `
            -RepoRoot "${{ github.workspace }}" `
            -OutputDir "$env:RUNNER_TEMP\store-screenshots"

      - name: Upload the store screenshots
        if: ${{ inputs.screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-screenshots
          path: ${{ runner.temp }}/store-screenshots/*.png
          if-no-files-found: error

      # Presses a button. Everything above this asserts the app is signed, installed correctly and
      # showing a window; none of it exercises a control, so a dead button passes all of it. The
      # sibling project's Windows test asserted exactly that much and stayed green through two
      # Microsoft Store rejections. Off by default only because it needs the seeded journey the
      # screenshot step creates; turn it on with the same input.
      - name: Press "I Did It" and assert the reveal changed
        if: ${{ inputs.screenshots }}
        shell: pwsh
        run: |
          ./tools/click-test-windows.ps1 `
            -InstalledExe "${{ steps.installed.outputs.exe }}" `
            -RepoRoot "${{ github.workspace }}"

      - name: Upload the click-test screenshots
        if: ${{ always() && inputs.screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-click-test
          path: |
            ${{ runner.temp }}/click-before.png
            ${{ runner.temp }}/click-after.png
          if-no-files-found: warn

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: |
            ${{ runner.temp }}/screen.png
            ${{ runner.temp }}/install.log
          if-no-files-found: warn

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: RevealTheDream-Windows-installer
          path: android/desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      # Opt in, never automatic. A workflow that publishes to the public as a side effect of being
      # run is one somebody triggers by accident, and it only happens after every check above has
      # passed, so an unverified build cannot reach a customer.
      - name: Publish to the latest release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "${{ steps.installed_pkg.outputs.installer }}"
          gh release upload latest "$installer" --clobber --repo ${{ github.repository }}
          Write-Host "Published $(Split-Path $installer -Leaf)"

          # UPDATE THE MANIFEST IN THE SAME STEP. The website resolves /download/windows through
          # latest.json, so an installer uploaded without updating it leaves the site serving the
          # PREVIOUS build while the new one sits in the release unreferenced. That is not
          # hypothetical: it is exactly what happened between 2026-08-02 and 08-03, when three
          # commits including security fixes were published to the release and the site kept
          # handing out the older build, because the manifest was maintained by hand.
          #
          # Everything below is read back from the asset GitHub actually stored, never assumed.
          # GitHub rewrites spaces in asset names to dots, so a constructed filename is wrong.
          # SELECT BY VERSION, NOT "the first .exe". `--clobber` only replaces an asset with the
          # SAME name, and every version has a new name, so the release accumulates them:
          # 1.1.0 and 1.2.0 now both sit there. `Select-Object -First 1` picked 1.1.0 on the
          # 2026-08-04 publish and pointed the manifest at the OLD build while claiming the new
          # version, which would have told every customer to update and then handed them the same
          # build back. An update loop that never updates.
          $version = "${{ steps.find.outputs.version }}"
          $candidates = @(gh release view latest --repo ${{ github.repository }} --json assets |
                   ConvertFrom-Json |
                   Select-Object -ExpandProperty assets |
                   Where-Object { $_.name -like "*.exe" -and $_.name -like "*$version*" })
          if ($candidates.Count -ne 1) {
            Write-Error "Expected exactly one .exe on the release naming $version, found $($candidates.Count)."
            $candidates | ForEach-Object { Write-Host "  $($_.name)" }
            exit 1
          }
          $asset = $candidates[0]

          gh release download latest --repo ${{ github.repository }} --pattern latest.json --output latest.json --clobber
          $manifest = Get-Content latest.json -Raw | ConvertFrom-Json
          $manifest.winUrl = "https://github.com/${{ github.repository }}/releases/download/latest/$($asset.name)"
          $manifest.winSizeBytes = $asset.size
          # winVersion IS THE UPDATE CHECK. DesktopUpdateCheck.kt fetches this manifest and compares
          # this exact field against its own APP_VERSION. It was not being written here at all, so
          # the download link would have started serving 1.2.0 while the manifest still said 1.1.0
          # and every installed copy stayed silent forever.
          $manifest.winVersion = $version
          $manifest.buildEpoch = [int][double]::Parse((Get-Date -UFormat %s))

          # WRITE IT BACK TO DISK. `gh release upload` sends the FILE, and every line above only
          # mutated an in-memory object. Without this the freshly downloaded, unmodified latest.json
          # is what gets uploaded.
          #
          # This line existed, was dropped when the step was rewritten on 2026-08-04, and the
          # rewrite shipped green: the 1.3.0 run uploaded the installer, logged "Manifest now points
          # at Reveal.the.Dream-1.3.0.exe ... winVersion 1.3.0", passed all four assertions, and
          # left the published manifest still saying 1.2.0. Every assertion tested `$manifest`, the
          # object that was correct, rather than the file that was not.
          $manifest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8

          # ASSERT BEFORE UPLOADING, AND ASSERT THE FILE. These checks used to run AFTER
          # `gh release upload latest.json`, which meant the broken manifest was already live by the
          # time they failed: the job went red having published exactly the state it was meant to
          # prevent. A gate that fires after the damage is a report, not a gate.
          #
          # They now re-read latest.json from disk instead of inspecting `$manifest`. Checking the
          # in-memory object could only ever confirm the assignments a few lines above it, which is
          # why it went on passing while the artifact was wrong. Verify the thing you are about to
          # ship, not the variable you built it from.
          $onDisk = Get-Content latest.json -Raw | ConvertFrom-Json
          if ($onDisk.winSizeBytes -ne $asset.size) { Write-Error "Manifest on disk disagrees with the asset"; exit 1 }
          if ($onDisk.winVersion -ne $version) { Write-Error "Manifest on disk says $($onDisk.winVersion), expected $version. The write-back did not happen."; exit 1 }
          if ($asset.name -notlike "*$($onDisk.winVersion)*") {
            Write-Error "Manifest says $($onDisk.winVersion) but the asset is $($asset.name). Customers would be offered a build that is not the one named."
            exit 1
          }
          if ($onDisk.winUrl -notlike "*$($asset.name)") { Write-Error "winUrl does not end in the asset name"; exit 1 }

          gh release upload latest latest.json --clobber --repo ${{ github.repository }}

          # AND ASSERT WHAT ACTUALLY LANDED. Everything above proves the bytes were correct when
          # they left this runner. It does not prove the upload replaced anything: `--clobber` can
          # be a no-op against an unexpected asset name, and a partial upload is possible. So pull
          # the published manifest back down through the API and read it.
          #
          # The API, not the browser download URL: release assets sit behind a CDN that ignores
          # cache-busting query strings, so a fetch of the public URL can return the previous file
          # for minutes and would make a correct publish look broken (and, worse, a broken one look
          # fine on the next run).
          $assetId = gh api "repos/${{ github.repository }}/releases/tags/latest" --jq '.assets[] | select(.name=="latest.json") | .id'
          $published = gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$assetId" | ConvertFrom-Json
          if ($published.winVersion -ne $version) {
            Write-Error "PUBLISHED manifest says $($published.winVersion), expected $version. The upload did not take."
            exit 1
          }
          if ($published.winUrl -notlike "*$($asset.name)") {
            Write-Error "PUBLISHED winUrl is $($published.winUrl), expected it to end in $($asset.name)."
            exit 1
          }
          Write-Host "Published manifest verified: winVersion $($published.winVersion), $($published.winUrl)"
