name: Build and verify the Windows MSI

# LIVES IN THE PUBLIC INSTALLERS REPO ON PURPOSE.
#
# The source repo (none298-dotcom/revealthedream) is PRIVATE, so its Actions minutes are metered
# and the account is billing blocked: a workflow committed there does not run at all, it is
# refused before the runner starts. Public repositories get free Actions minutes, so the build
# lives here and checks the private source out with a read-only token. Source never lands in this
# repo, only the finished installer does. Same arrangement as MyLinedChart-installers.
#
# Do NOT "tidy" this back into the source repo. It will silently stop running.
#
# ONE-TIME SETUP, in this repo's Settings > Secrets and variables > Actions:
#   Secret PRIVATE_REPO_TOKEN: a fine-grained PAT with Contents: Read-only on
#   none298-dotcom/revealthedream.
#
# The verification steps exist because a sibling project failed Microsoft certification with
# "the product crashes at launch" while its own smoke test was green, because that test ran the
# app from the SOURCE folder and the shipped installer was missing a file. Every assertion below
# is made against the INSTALLED artifact.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Private repo branch, tag or SHA to build"
        default: "main"
        required: true
      publish:
        description: "Attach the MSI to the 'latest' release here"
        type: boolean
        default: false

permissions:
  contents: write     # create/update the Release on this public repo
  id-token: write     # OIDC token for Azure Trusted Signing, so no cert is stored here

jobs:
  build-and-verify:
    # `secrets` is not a valid context in a step-level `if:` (GitHub rejects the whole workflow
    # with "Unrecognized named-value: 'secrets'"). Surfacing them as job env vars is the supported
    # way for a step to ask "is signing configured here?", which keeps the build working in a
    # fork with no Azure access.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    # PINNED, not windows-latest. windows-latest moved to Server 2025, where a byte identical
    # installer passed 1 run in 6 against 3 of 3 on Server 2022 on the sibling project. Only move
    # this deliberately, and compare over at least six runs.
    runs-on: windows-2022

    steps:
      - name: Check out the PRIVATE source
        uses: actions/checkout@v4
        with:
          repository: none298-dotcom/revealthedream
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No Android SDK is installed here and none is needed: :desktop is plain Kotlin/JVM.
      # Verified 2026-08-02 on a checkout with local.properties removed and ANDROID_HOME cleared.
      # If this starts failing with "SDK location not found", something has made :desktop depend
      # on an Android module, and that is the real bug.
      - name: Build the MSI
        working-directory: android
        run: ./gradlew :desktop:packageMsi --console=plain --no-daemon

      - name: Find the installer
        id: find
        shell: pwsh
        working-directory: android
        run: |
          $msi = Get-ChildItem -Recurse -Filter *.msi -Path desktop/build/compose/binaries | Select-Object -First 1
          if (-not $msi) { Write-Error "No MSI was produced"; exit 1 }
          "msi=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "MSI: $($msi.Name)  $([math]::Round($msi.Length/1MB,1)) MB"

      # SIGN BEFORE INSTALLING, so everything below verifies the artifact a customer will run,
      # not an unsigned near-copy of it.
      #
      # trusted-signing-action authenticates via DefaultAzureCredential, which knows nothing about
      # GitHub OIDC on its own. Without azure/login first it falls through every credential in the
      # chain (CLI, Developer CLI, Visual Studio) and dies with "SignerSign() failed". azure/login
      # performs the federated exchange and leaves the runner in a state the action can use.
      #
      # Nothing secret lives in this public repo: the three AZURE_* values are identifiers, and
      # the certificate is short lived, minted by Azure per run.
      - name: Azure login (federated, OIDC)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Signs as Little Bird Trading LLC, the identity validation behind this account. The MSI's
      # own Manufacturer field is set to match in android/desktop/build.gradle.kts; if the signing
      # identity ever changes, change that too or Windows shows two different companies.
      - name: Sign the MSI (Azure Trusted Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          # MUST be absolute. The signing client rejects a relative path outright with
          # "The file path '...' is not rooted."
          files: ${{ steps.find.outputs.msi }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A signing step that quietly did nothing still reports success, so assert on the file.
      # Countersigner matters as much as signer: without a timestamp the signature dies the day
      # the certificate expires, and Trusted Signing certificates are short lived by design.
      - name: Assert the signature actually landed
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "${{ steps.find.outputs.msi }}"
          Write-Host "Status:        $($sig.Status)"
          Write-Host "Signer:        $($sig.SignerCertificate.Subject)"
          Write-Host "Timestamp:     $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "Signature is $($sig.Status), not Valid"; exit 1 }
          if (-not $sig.TimeStamperCertificate) { Write-Error "Signed but NOT timestamped"; exit 1 }
          if ($sig.SignerCertificate.Subject -notmatch 'Little Bird Trading') {
            Write-Error "Signed by an unexpected identity: $($sig.SignerCertificate.Subject)"; exit 1
          }

      # /qn is MSI's silent switch. Worth noting the shape of the trap: the sibling project used
      # NSIS, where the switch is /S and is CASE SENSITIVE, and lowercase /s opens the interactive
      # installer and hangs the job forever.
      - name: Silent install
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\install.log"
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i", "`"${{ steps.find.outputs.msi }}`"", "/qn", "/norestart", "/L*v", "`"$log`"")
          Write-Host "msiexec exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; Write-Error "Install failed"; exit 1 }

      - name: Locate the INSTALLED executable
        id: installed
        shell: pwsh
        run: |
          # perUserInstall = true, so it lands under LOCALAPPDATA. Both roots are searched anyway,
          # because flipping that setting must not quietly turn this gate into a no-op that never
          # finds the binary and therefore never fails.
          $roots = @("$env:LOCALAPPDATA", "$env:ProgramFiles", "${env:ProgramFiles(x86)}")
          $exe = $null
          foreach ($r in $roots) {
            if (-not $r) { continue }
            $f = Get-ChildItem -Path $r -Recurse -Filter "Reveal the Dream.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { $exe = $f.FullName; break }
          }
          if (-not $exe) { Write-Error "Installed executable not found"; exit 1 }
          "exe=$exe" >> $env:GITHUB_OUTPUT
          Write-Host "Installed: $exe"

      - name: Launch it and assert it is really up
        shell: pwsh
        run: |
          $exe = "${{ steps.installed.outputs.exe }}"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "Launched PID $($proc.Id) from $exe"

          # THE WINDOW BELONGS TO A CHILD PID. jpackage's launcher .exe re-execs, so the process
          # Start-Process hands back is not the one that owns the window: this run reported the
          # launcher as PID 7752 and the window on PID 7776. A check that only ever looks at
          # $proc.MainWindowHandle can therefore NEVER pass, no matter how long it waits.
          #
          # That is what the first version of this step did, and it failed while the screenshot
          # showed the app running perfectly. The obvious reading was "cold runner, too slow" and
          # it was wrong; the log now prints how long the window took, and it is 3s. Polling was
          # not the fix, matching on the binary path was. Both are kept: the poll so a slow start
          # is not a false failure, the path match so the assertion can succeed at all.
          $deadline = (Get-Date).AddSeconds(150)
          $hwnd = 0
          $owner = $null
          while ((Get-Date) -lt $deadline) {
            # Liveness is checked and is explicitly NOT the assertion. On the sibling project the
            # check was "is the process alive", and Electron kept the process up behind a crash
            # dialog, so three runs scored green while the app showed an error. A JVM app has the
            # same shape: an uncaught exception on the event thread does not necessarily exit.
            if ($proc.HasExited) {
              Write-Error "Exited after $([int]((Get-Date) - $proc.StartTime).TotalSeconds)s, code $($proc.ExitCode)"
              exit 1
            }

            # Check the launched process first, then any process running THIS SAME BINARY. The
            # second case covers a launcher that re-execs into a child PID; without it a healthy
            # app would read as windowless. Matching on the path and not on the window title is
            # deliberate, so a leftover window from an earlier run cannot satisfy this.
            $proc.Refresh()
            if ($proc.MainWindowHandle -ne 0) { $hwnd = $proc.MainWindowHandle; $owner = $proc; break }

            $sibling = Get-Process | Where-Object {
              $_.MainWindowHandle -ne 0 -and $_.Path -eq $exe
            } | Select-Object -First 1
            if ($sibling) { $hwnd = $sibling.MainWindowHandle; $owner = $sibling; break }

            Start-Sleep -Seconds 3
          }

          if ($hwnd -eq 0) {
            Write-Error "Alive for 150s with no window. Running, but showing nothing."
            exit 1
          }
          $waited = [int]((Get-Date) - $proc.StartTime).TotalSeconds
          Write-Host "Window appeared after ${waited}s"
          Write-Host "  PID:    $($owner.Id)$(if ($owner.Id -ne $proc.Id) { ' (child of the launcher)' })"
          Write-Host "  Path:   $($owner.Path)"
          Write-Host "  Handle: $hwnd"
          Write-Host "  Title:  $($owner.MainWindowTitle)"

          # A window that exists but is a 1x1 sliver, or an error dialog, is not the app running.
          # The DMG gate learned this the same way and asserts a minimum size for the same reason.
          # Built as a joined single-quoted string, NOT a @'...'@ here-string: PowerShell requires
          # the here-string terminator at column 0, which is illegal inside a YAML block scalar
          # and makes the whole workflow file unparseable.
          $sig = 'public struct RECT { public int L, T, R, B; } ' +
                 '[DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);'
          Add-Type -Namespace W -Name N -MemberDefinition $sig
          $r = New-Object W.N+RECT
          [void][W.N]::GetWindowRect($hwnd, [ref]$r)
          $w = $r.R - $r.L; $h = $r.B - $r.T
          Write-Host "  Size:   ${w}x${h}"
          if ($w -lt 300 -or $h -lt 300) {
            Write-Error "Window is only ${w}x${h}. Too small to be the app."
            exit 1
          }

          # Give the screenshot step a settled frame to capture rather than a half-painted one.
          Start-Sleep -Seconds 5

      - name: Screenshot, so a human can look at it
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\screen.png")
          Write-Host "Captured $($b.Width)x$($b.Height)"

      # The failure text may never reach stdout or stderr. On Windows it lands here, and a gate
      # that does not read this log will tell you everything is fine.
      - name: Read the Windows Application event log
        if: always()
        shell: pwsh
        run: |
          $events = Get-WinEvent -FilterHashtable @{
            LogName='Application'; Level=1,2; StartTime=(Get-Date).AddMinutes(-10)
          } -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'Reveal|java|jpackage' }
          if ($events) {
            $events | Select-Object -First 10 | Format-List TimeCreated, ProviderName, Message
            if ($events | Where-Object { $_.Message -match 'Reveal the Dream' }) {
              Write-Error "Application event log carries an error naming this app"; exit 1
            }
          } else { Write-Host "No error-level Application events naming this app" }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: |
            ${{ runner.temp }}/screen.png
            ${{ runner.temp }}/install.log
          if-no-files-found: warn

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: RevealTheDream-Windows-msi
          path: android/desktop/build/compose/binaries/**/*.msi
          if-no-files-found: error

      # Opt in, never automatic. A workflow that publishes to the public as a side effect of being
      # run is one somebody triggers by accident, and it only happens after every check above has
      # passed, so an unverified build cannot reach a customer.
      - name: Publish to the latest release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = "${{ steps.find.outputs.msi }}"
          gh release upload latest "$msi" --clobber --repo ${{ github.repository }}
          Write-Host "Published $(Split-Path $msi -Leaf)"
