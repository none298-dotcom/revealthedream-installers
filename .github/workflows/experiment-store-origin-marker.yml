name: EXPERIMENT - can a jpackage Burn EXE carry a Store-origin marker

# THROWAWAY RESEARCH WORKFLOW. Not wired to any release. Answers one question: can Partner
# Center's "Installer parameters" field (tools/windows-store-install-parameters.txt in the
# private repo, currently "/quiet /norestart") smuggle an extra custom property THROUGH the
# jpackage-built Burn bootstrapper EXE into the wrapped MSI, where it could be written to the
# registry as a permanent "installed via the Store" marker?
#
# It builds a throwaway jpackage EXE with the SAME shape the real app uses (--type exe,
# --win-per-user-install, a fixed --win-upgrade-uuid, on windows-2022), using --temp to keep
# jpackage's generated WiX sources instead of deleting them, so the real bundle.wxs/main.wxs can
# be read rather than guessed at. It then runs the built EXE with a custom, never-before-seen
# public property on the command line (CUSTOMPROP=StoreValue) plus Burn's own /log switch, and
# reads Burn's log for whether that property ever reached the wrapped msiexec invocation. As a
# sanity check it repeats AGENTS.md's already-measured ALLUSERS=2 MSIINSTALLPERUSER=1 case for
# comparison against a documented result.
#
# No file in the private repo is touched. This workflow deletes itself at the end of the run
# that produced the evidence.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Set up JDK 21 (jpackage lives here)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Confirm jpackage and WiX
        shell: pwsh
        run: |
          & "$env:JAVA_HOME\bin\jpackage.exe" --version
          # jpackage's exe/msi types shell out to WiX Toolset v3 (candle.exe/light.exe), which
          # windows-2022 runner images ship pre-installed for exactly this reason.
          $wixPath = $env:WIX
          Write-Host "WIX env var: $wixPath"
          Get-ChildItem "$wixPath\bin" -Filter *.exe | Select-Object Name

      - name: Build a minimal Hello World app to package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path in, out, tmp | Out-Null
          @'
          public class Hello {
              public static void main(String[] args) throws Exception {
                  // Idle so a CI step could attach if it ever needed to; not used here.
                  Thread.sleep(200);
              }
          }
          '@ | Set-Content -Path Hello.java -Encoding UTF8
          & "$env:JAVA_HOME\bin\javac.exe" Hello.java
          & "$env:JAVA_HOME\bin\jar.exe" --create --file in\hello.jar --main-class Hello Hello.class

      - name: jpackage --type exe, --temp kept (this is what reveals the generated WiX authoring)
        shell: pwsh
        run: |
          & "$env:JAVA_HOME\bin\jpackage.exe" `
            --type exe `
            --name ExpApp `
            --app-version 1.0.0 `
            --input in `
            --main-jar hello.jar `
            --main-class Hello `
            --dest out `
            --temp tmp `
            --win-per-user-install `
            --win-dir-chooser `
            --win-upgrade-uuid 11111111-1111-1111-1111-111111111111 `
            --verbose
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed with $LASTEXITCODE" }
          Get-ChildItem out

      - name: Dump jpackage's generated WiX authoring (this is the actual evidence, not a guess)
        shell: pwsh
        run: |
          Write-Host "===== .wxs / .wxi files jpackage generated ====="
          Get-ChildItem tmp -Recurse -Include *.wxs, *.wxi, *.wxl | ForEach-Object {
            Write-Host "----- $($_.FullName) -----"
            Get-Content $_.FullName
          }
          Write-Host "===== Does the generated bundle declare ANY overridable Variable or MsiProperty? ====="
          $hits = Get-ChildItem tmp -Recurse -Include *.wxs, *.wxi |
            Select-String -Pattern 'Overridable|MsiProperty|<Variable' -SimpleMatch:$false
          if ($hits) { $hits | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line)" } }
          else { Write-Host "NONE FOUND: no <Variable>, no Overridable attribute, no <MsiProperty> anywhere in the generated bundle." }

      - name: "Baseline install: exactly tools/windows-store-install-parameters.txt (/quiet /norestart)"
        shell: pwsh
        run: |
          $exe = (Get-ChildItem out -Filter *.exe | Select-Object -First 1).FullName
          Write-Host "Installer: $exe"
          $p = Start-Process -FilePath $exe -ArgumentList '/quiet','/norestart','/log',(Join-Path $PWD 'baseline-burn.log') -PassThru -Wait
          Write-Host "Exit code: $($p.ExitCode)"

      - name: Read the baseline Burn log
        shell: pwsh
        run: |
          Get-Content baseline-burn.log

      - name: Helper functions (product code lookup, clean removal via msiexec, not registry guessing)
        shell: pwsh
        run: |
          @'
          function Get-ExpAppProductCode {
            $msi = New-Object -ComObject WindowsInstaller.Installer
            $related = $msi.GetType().InvokeMember('RelatedProducts', 'GetProperty', $null, $msi, @('{11111111-1111-1111-1111-111111111111}'))
            $codes = @($related)
            if ($codes.Count -ge 1) { return $codes[0] } else { return $null }
          }
          function Get-ExpAppProductInfo([string]$code, [string]$prop) {
            $msi = New-Object -ComObject WindowsInstaller.Installer
            try { return $msi.GetType().InvokeMember('ProductInfo', 'GetProperty', $null, $msi, @($code, $prop)) }
            catch { return $null }
          }
          function Remove-ExpApp {
            $code = Get-ExpAppProductCode
            if ($code) {
              Write-Host "Removing product $code via msiexec /x"
              $p = Start-Process -FilePath msiexec.exe -ArgumentList '/x', $code, '/quiet', '/norestart' -PassThru -Wait
              Write-Host "msiexec /x exit code: $($p.ExitCode)"
            } else {
              Write-Host "No related product found for the upgrade code (already clean)"
            }
          }
          '@ | Set-Content -Path helpers.ps1 -Encoding UTF8

      - name: Confirm clean state right after baseline (prove the product IS registered)
        shell: pwsh
        run: |
          . .\helpers.ps1
          $code = Get-ExpAppProductCode
          Write-Host "Product code after baseline install: $code"
          if (-not $code) { throw "baseline install did not register a product - the whole experiment rests on this" }

      - name: Uninstall the baseline copy cleanly (msiexec /x by product code)
        shell: pwsh
        run: |
          . .\helpers.ps1
          Remove-ExpApp
          $code = Get-ExpAppProductCode
          if ($code) { throw "still registered after uninstall: $code" }
          Write-Host "Confirmed clean: no related product registered"

      - name: Trial A - a fresh install with a CUSTOM never-declared public property
        shell: pwsh
        run: |
          $exe = (Get-ChildItem out -Filter *.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -ArgumentList '/quiet','/norestart','CUSTOMPROP=StoreValue','/log',(Join-Path $PWD 'customprop-burn.log') -PassThru -Wait
          Write-Host "Exit code: $($p.ExitCode)"
          Select-String -Path customprop-burn.log -Pattern '^(Action (start|ended) .*: (INSTALL|InstallFinalize)\.|Installation completed successfully|reconfigured the product)'

      - name: Read Trial A's Burn log and search for the property
        shell: pwsh
        run: |
          Write-Host "===== grep for CUSTOMPROP in the log ====="
          $found = Select-String -Path customprop-burn.log -Pattern 'CUSTOMPROP'
          if ($found) { $found } else { Write-Host "CUSTOMPROP NEVER APPEARS IN THE LOG AT ALL." }

      - name: Did the custom property reach the registry anywhere, after a FRESH Trial A install?
        shell: pwsh
        run: |
          . .\helpers.ps1
          $code = Get-ExpAppProductCode
          Write-Host "Product code: $code"
          Write-Host "===== ProductInfo well-known fields (native MSI accounting, no custom authoring needed) ====="
          foreach ($field in 'InstallSource','InstallLocation','RegOwner','RegCompany','HelpLink','ProductName') {
            Write-Host "$field = $(Get-ExpAppProductInfo $code $field)"
          }
          Write-Host "===== Does StoreValue appear ANYWHERE under this user's registry? (no Permanent=yes, no custom Component authored) ====="
          $matches = & reg.exe query 'HKCU' /s /f 'StoreValue' 2>&1
          $lastExit = $LASTEXITCODE
          if ($lastExit -eq 0) { Write-Host $matches } else { Write-Host "reg.exe found no match for StoreValue anywhere under HKCU (expected: no Registry table exists in this bundle)" }

      - name: Uninstall before the ARPCOMMENTS trial
        shell: pwsh
        run: |
          . .\helpers.ps1
          Remove-ExpApp

      - name: Trial B - ARPCOMMENTS, a RESERVED property MSI writes to the Uninstall registry key natively, no authoring needed
        shell: pwsh
        run: |
          $exe = (Get-ChildItem out -Filter *.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -ArgumentList '/quiet','/norestart','ARPCOMMENTS=MicrosoftStoreOrigin','/log',(Join-Path $PWD 'arpcomments-burn.log') -PassThru -Wait
          Write-Host "Exit code: $($p.ExitCode)"
          . .\helpers.ps1
          $code = Get-ExpAppProductCode
          Write-Host "Product code: $code"
          $bare = $code.Trim('{','}')
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{$bare}"
          Write-Host "===== Reading $key ====="
          Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue | Format-List DisplayName, Comments

      - name: Now simulate OUR OWN updater's silent re-run (SILENT_ARGUMENTS = /quiet /norestart, no property at all) and re-check Comments
        shell: pwsh
        run: |
          $exe = (Get-ChildItem out -Filter *.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -ArgumentList '/quiet','/norestart','/log',(Join-Path $PWD 'updater-replay-burn.log') -PassThru -Wait
          Write-Host "Exit code: $($p.ExitCode)"
          . .\helpers.ps1
          $code = Get-ExpAppProductCode
          $bare = $code.Trim('{','}')
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{$bare}"
          Write-Host "===== Reading $key after a plain /quiet /norestart re-run (exactly what UpdateInstaller.SILENT_ARGUMENTS does) ====="
          Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue | Format-List DisplayName, Comments
          Write-Host "If Comments is now blank, the marker did NOT survive our own updater's plain re-run."

      - name: Uninstall before Trial C
        shell: pwsh
        run: |
          . .\helpers.ps1
          Remove-ExpApp

      - name: Trial C - reconfirm AGENTS.md's ALLUSERS/MSIINSTALLPERUSER result on THIS build, same method, FRESH install
        shell: pwsh
        run: |
          $exe = (Get-ChildItem out -Filter *.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -ArgumentList '/quiet','/norestart','ALLUSERS=2','MSIINSTALLPERUSER=1','/log',(Join-Path $PWD 'alluserstest-burn.log') -PassThru -Wait
          Write-Host "Exit code: $($p.ExitCode)"
          . .\helpers.ps1
          $code = Get-ExpAppProductCode
          $assignment = Get-ExpAppProductInfo $code 'AssignmentType'
          Write-Host "ExpApp AssignmentType (0=per-user, 1=per-machine) after passing ALLUSERS=2 MSIINSTALLPERUSER=1: $assignment"
          Write-Host "===== Do ALLUSERS / MSIINSTALLPERUSER show up as live properties in the log, same as CUSTOMPROP did? ====="
          Select-String -Path alluserstest-burn.log -Pattern 'Property\(S\): (ALLUSERS|MSIINSTALLPERUSER) ='

      - name: Final uninstall
        shell: pwsh
        continue-on-error: true
        run: |
          . .\helpers.ps1
          Remove-ExpApp

      - name: Upload logs and generated WiX sources as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-origin-marker-experiment
          path: |
            *-burn.log
            tmp/**/*.wxs
            tmp/**/*.wxi
          if-no-files-found: warn
